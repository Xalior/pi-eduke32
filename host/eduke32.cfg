;
; eduke32.cfg — the settings this port ships on the card.
;
; EDuke32 writes this file back as it runs, so what is here is a starting
; point rather than a fixed configuration. Anything not named takes the
; game's own default.
;
; It lives in the game's own directory on the card, never in the card's
; root: one card carries several games, and two of them writing a settings
; file into the root would each silently overwrite the other's.
;

[Screen Setup]
; The renderer. 0 is the classic 8-bit software renderer, which is the only
; one built into this image — there is no OpenGL under this board, and both
; hardware renderers are compiled out.
ScreenMode = 0
ScreenBPP = 8

; The size the game draws at. It must match the virtual display the kernel
; declares before the game starts (see host/kernel.cpp): the shim scales
; whatever the game produces up to the panel in one pass, so a larger number
; here buys detail at a cost paid per pixel by one core, and buys nothing at
; all in output size.
;
; It is also the smallest picture the engine will accept — it rejects
; anything below 640 by 480 — so this is the cheapest the classic renderer
; can be asked to be, not a size chosen for its own sake.
ScreenWidth = 640
ScreenHeight = 480

[Sound Setup]
; Music from the GRP is MIDI, played by the OPL3 emulation that ships with
; the game. The compressed-music decoders are not built into this image —
; two of them decode on a worker thread, and there are no threads here.
MusicDevice = 0
